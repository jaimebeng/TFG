# Conda environment for exact reproduction of the study.
# Create with:  conda env create -f environment.yml   then:  conda activate TFG
# (env name and versions match the environment used to produce the published results)
name: TFG
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.15
  - numpy=2.4.4
  - pandas=3.0.2
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - statsmodels=0.14.6
  - matplotlib=3.10.8
  - joblib=1.5.3
  - cvxpy=1.8.2
  - requests=2.33.1
  - beautifulsoup4=4.14.3
  - fredapi=0.5.2
  - pandas-market-calendars=5.3.2
  - yfinance=1.3.0
  - pip
  - pip:
      - optuna==4.8.0
      - xgboost==3.2.0
      - torch==2.11.0   # study used the +cu128 (CUDA 12.8) build; omit suffix for CPU
